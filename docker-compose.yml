services:
  postgres:
    image: postgres:14.15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq_broker
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_BROKER_URL=${RABBITMQ_BROKER_URL}
      - RABBITMQ_RESULT_BACKEND=${RABBITMQ_RESULT_BACKEND}
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI for RabbitMQ

  flask:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: flask_app
    depends_on:
      - rabbitmq
      - postgres
    environment:
      - FLASK_DEBUG=0
      - FLASK_APP=run.py
    env_file:
      - .env
    # Exposes the port only to service containers within same Docker network
    expose:
      - "8000"
    command: >
      gunicorn run:app 
      --bind 0.0.0.0:8000 
      --workers 4
      --threads 2
      --timeout 60
  
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    depends_on:
      - rabbitmq
      - postgres
    env_file:
      - .env
    # Worker instance processes one tasks at a time -> max concurrent job = (num of workers * concurrency rate) 
    command: ["celery", "-A", "run.celery", "worker", "--loglevel=info", "--concurrency=1"]

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: celery_beat
    depends_on:
      - rabbitmq
      - postgres
    env_file:
      - .env
    command: ["celery", "-A", "run.celery", "beat", "--loglevel=info"]

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    depends_on:
      - flask
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
