# pre-commit install
# pre-commit run <file or --all-files>

exclude: ^.*__init__\.py$ # Needed to avoid circular dependencies.
repos:
  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.1
    hooks:
      - id: autopep8
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8